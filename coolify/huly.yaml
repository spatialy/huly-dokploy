# documentation: https://huly.io/docs/self-hosting
# slogan: "All-in-One Project Management with AI, Video Calls, and Real-Time Collaboration"
# tags: project-management, collaboration, task-management, crm, hr, devops, linear, jira, notion
# logo: svgs/huly.svg
# port: 80
# minversion: 4.0.0-beta.228

services:
  nginx:
    image: nginx:1.21.3
    environment:
      - SERVICE_FQDN_NGINX_80
      - HOST_ADDRESS=${HOST_ADDRESS:-huly.example.com}
    volumes:
      - type: bind
        source: ./volumes/nginx/huly.nginx.conf
        target: /etc/nginx/nginx.template
        content: |
          server {
              listen 80;
              server_name _;
              client_max_body_size 0;

              # Docker embedded DNS - required for variable-based upstream resolution
              resolver 127.0.0.11 valid=10s;

              # Frontend
              location / {
                  set $$upstream_front http://front:8080;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_pass $$upstream_front;
              }

              # Accounts - WITH COOKIE FIXES FOR V7 SESSION PERSISTENCE
              location /_accounts {
                  set $$upstream_account http://account:3000;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  # IMPORTANT: Hardcode https - $$scheme returns "http" inside Docker container
                  proxy_set_header X-Forwarded-Proto https;

                  rewrite ^/_accounts$$ / break;
                  rewrite ^/_accounts(/.*)$$ $$1 break;

                  # Cookie handling fixes for V7 session persistence
                  proxy_cookie_path / /;
                  proxy_cookie_flags ~ secure samesite=lax;
                  # Dynamic cookie domain - replaced by entrypoint.sh
                  proxy_cookie_domain PARENT_DOMAIN_PLACEHOLDER HOST_ADDRESS_PLACEHOLDER;

                  proxy_pass $$upstream_account;
              }

              # Love (Video calls service)
              location /_love {
                  set $$upstream_love http://love:8097;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_love(/.*)$$ $$1 break;
                  proxy_pass $$upstream_love;
              }

              # Collaborator (WebSocket)
              location /_collaborator {
                  set $$upstream_collaborator http://collaborator:3078;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_collaborator(/.*)$$ $$1 break;
                  proxy_pass $$upstream_collaborator;
              }

              # Transactor (WebSocket)
              location /_transactor {
                  set $$upstream_transactor http://transactor:3333;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_transactor(/.*)$$ $$1 break;
                  proxy_pass $$upstream_transactor;
              }

              # Transactor token shortcuts (JWT paths)
              location ~ ^/eyJ {
                  set $$upstream_transactor_jwt http://transactor:3333;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_pass $$upstream_transactor_jwt;
              }

              # Rekoni
              location /_rekoni {
                  set $$upstream_rekoni http://rekoni:4004;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  rewrite ^/_rekoni(/.*)$$ $$1 break;
                  proxy_pass $$upstream_rekoni;
              }

              # Stats
              location /_stats {
                  set $$upstream_stats http://stats:4900;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  rewrite ^/_stats(/.*)$$ $$1 break;
                  proxy_pass $$upstream_stats;
              }

              # Pulse (WebSocket)
              location /_pulse {
                  set $$upstream_pulse http://hulypulse:8098;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection "upgrade";

                  rewrite ^/_pulse(.*)$$ /ws$$1 break;
                  proxy_pass $$upstream_pulse;
              }

              # Stream
              location /_stream {
                  set $$upstream_stream http://stream:1081;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  rewrite ^/_stream(.*)$$ $$1 break;
                  proxy_pass $$upstream_stream;
              }

              # Preview
              location /_preview {
                  set $$upstream_preview http://preview:4043;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  rewrite ^/_preview(.*)$$ $$1 break;
                  proxy_pass $$upstream_preview;
              }

              # Datalake
              location /_datalake {
                  set $$upstream_datalake http://datalake:4031;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  rewrite ^/_datalake(/.*)$$ $$1 break;
                  proxy_pass $$upstream_datalake;
              }

              # GitHub Integration
              location /_github {
                  set $$upstream_github http://github:3500;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  rewrite ^/_github(/.*)$$ $$1 break;
                  proxy_pass $$upstream_github;
              }

              # Print
              location /_print {
                  set $$upstream_print http://print:4005;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  rewrite ^/_print(/.*)$$ $$1 break;
                  proxy_pass $$upstream_print;
              }

              # AI Bot
              location /_ai {
                  set $$upstream_ai http://aibot:4010;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_ai(/.*)$$ $$1 break;
                  proxy_pass $$upstream_ai;
              }

              # Calendar Integration
              location /_calendar {
                  set $$upstream_calendar http://calendar:8095;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  rewrite ^/_calendar(/.*)$$ $$1 break;
                  proxy_pass $$upstream_calendar;
              }

              # Gmail Integration
              location /_gmail {
                  set $$upstream_gmail http://gmail:8087;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  rewrite ^/_gmail(/.*)$$ $$1 break;
                  proxy_pass $$upstream_gmail;
              }

              # Telegram Bot Integration
              location /_telegram {
                  set $$upstream_telegram http://telegram-bot:8086;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  rewrite ^/_telegram(/.*)$$ $$1 break;
                  proxy_pass $$upstream_telegram;
              }

              # Backup API
              location /_backup {
                  set $$upstream_backup http://backup-api:4039;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  rewrite ^/_backup(/.*)$$ $$1 break;
                  proxy_pass $$upstream_backup;
              }

              # Export (extended timeouts for large workspace exports)
              location /_export {
                  set $$upstream_export http://export:4009;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_read_timeout 600;
                  proxy_send_timeout 600;
                  rewrite ^/_export(/.*)$$ $$1 break;
                  proxy_pass $$upstream_export;
              }

              # Sign (PDF digital signatures)
              location /_sign {
                  set $$upstream_sign http://sign:4006;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  rewrite ^/_sign(/.*)$$ $$1 break;
                  proxy_pass $$upstream_sign;
              }

              # LiveKit signaling (WebSocket)
              location /livekit/ {
                  set $$upstream_livekit http://livekit:7880;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 86400;
                  proxy_send_timeout 86400;
                  proxy_buffering off;
                  rewrite ^/livekit(/.*)$$ $$1 break;
                  proxy_pass $$upstream_livekit;
              }
          }
        is_directory: false
      - type: bind
        source: ./volumes/nginx/entrypoint.sh
        target: /entrypoint.sh
        content: |
          #!/bin/sh
          set -e

          # Calculate parent domain from HOST_ADDRESS
          # huly.example.com -> example.com
          # app.huly.example.com -> huly.example.com
          PARENT_DOMAIN=$$(echo "$$HOST_ADDRESS" | sed 's/^[^.]*\.//')

          echo "=== Huly V7 Nginx Entrypoint ==="
          echo "HOST_ADDRESS: $$HOST_ADDRESS"
          echo "PARENT_DOMAIN: $$PARENT_DOMAIN"

          # Always regenerate config from template (template is read-only, never modified)
          cp /etc/nginx/nginx.template /etc/nginx/conf.d/default.conf
          sed -i "s/PARENT_DOMAIN_PLACEHOLDER/.$$PARENT_DOMAIN/g" /etc/nginx/conf.d/default.conf
          sed -i "s/HOST_ADDRESS_PLACEHOLDER/$$HOST_ADDRESS/g" /etc/nginx/conf.d/default.conf

          echo "Nginx config generated from template!"
          echo "Starting nginx..."

          # Start nginx in foreground
          exec nginx -g 'daemon off;'
        is_directory: false
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    restart: unless-stopped

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=huly
      - COCKROACH_USER=huly
      - COCKROACH_PASSWORD=${SERVICE_PASSWORD_COCKROACH}
    volumes:
      - cr_data:/cockroach/cockroach-data
      - cr_certs:/cockroach/certs
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.11
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --default-log-level=info
    volumes:
      - redpanda:/var/lib/redpanda/data
    environment:
      - REDPANDA_SUPERUSER_USERNAME=admin
      - REDPANDA_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_REDPANDA}
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "user=admin", "-X", "pass=${SERVICE_PASSWORD_REDPANDA}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: "minio/minio"
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - files:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  elastic:
    image: "elasticsearch:7.14.2"
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - elastic:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped

  redis:
    image: redis:8.0.2-alpine3.21
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      redis:
        condition: service_started
    environment:
      - LIVEKIT_API_KEY=${SERVICE_PASSWORD_LIVEKITKEY}
      - LIVEKIT_API_SECRET=${SERVICE_PASSWORD_LIVEKITSECRET}
      - HOST_ADDRESS=${HOST_ADDRESS:-huly.example.com}
    ports:
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - type: bind
        source: ./volumes/livekit/livekit.yaml
        target: /etc/livekit.template
        content: |
          port: 7880
          bind_addresses:
            - 0.0.0.0
          rtc:
            tcp_port: 7881
            port_range_start: 50000
            port_range_end: 50100
            use_external_ip: true
            enable_loopback_candidate: false
          redis:
            address: redis:6379
          turn:
            enabled: true
            domain: LIVEKIT_DOMAIN_PLACEHOLDER
            udp_port: 3478
            external_tls: true
          keys:
            LIVEKIT_KEY_PLACEHOLDER: LIVEKIT_SECRET_PLACEHOLDER
          logging:
            json: false
            level: info
        is_directory: false
      - type: bind
        source: ./volumes/livekit/entrypoint.sh
        target: /entrypoint.sh
        content: |
          #!/bin/sh
          set -e

          echo "=== LiveKit Entrypoint ==="
          echo "Injecting API keys and domain into config..."

          cp /etc/livekit.template /etc/livekit.yaml
          sed -i "s|LIVEKIT_KEY_PLACEHOLDER|$$LIVEKIT_API_KEY|g" /etc/livekit.yaml
          sed -i "s|LIVEKIT_SECRET_PLACEHOLDER|$$LIVEKIT_API_SECRET|g" /etc/livekit.yaml
          sed -i "s|LIVEKIT_DOMAIN_PLACEHOLDER|$$HOST_ADDRESS|g" /etc/livekit.yaml

          echo "LiveKit config ready. Starting server..."
          exec /livekit-server --config /etc/livekit.yaml
        is_directory: false
    restart: unless-stopped

  rekoni:
    image: hardcoreeng/rekoni-service:${HULY_VERSION:-v0.7.353}
    environment:
      - SECRET=${SERVICE_PASSWORD_SECRET}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped

  mail:
    image: hardcoreeng/mail:${HULY_VERSION:-v0.7.353}
    environment:
      - PORT=8097
      - SOURCE=${MAIL_FROM:-}
      - QUEUE_CONFIG=redpanda:9092
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SES_ACCESS_KEY=${SES_ACCESS_KEY:-}
      - SES_SECRET_KEY=${SES_SECRET_KEY:-}
      - SES_REGION=${SES_REGION:-}
    restart: unless-stopped

  print:
    image: hardcoreeng/print:${HULY_VERSION:-v0.7.353}
    environment:
      - SECRET=${SERVICE_PASSWORD_SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STORAGE_CONFIG=datalake|http://datalake:4031
      - STATS_URL=http://stats:4900
    restart: unless-stopped

  github:
    image: hardcoreeng/github:${HULY_VERSION:-v0.7.353}
    environment:
      - PORT=3500
      - STORAGE_CONFIG=datalake|http://datalake:4031
      - SERVER_SECRET=${SERVICE_PASSWORD_SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - APP_ID=${GITHUB_APPID:-}
      - CLIENT_ID=${GITHUB_CLIENTID:-}
      - CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - COLLABORATOR_URL=wss://${HOST_ADDRESS:-huly.example.com}/_collaborator
      - WEBHOOK_SECRET=${SERVICE_PASSWORD_SECRET}
      - FRONT_URL=https://${HOST_ADDRESS:-huly.example.com}
      - BOT_NAME=${GITHUB_BOT_NAME:-}
    restart: unless-stopped

  transactor:
    image: hardcoreeng/transactor:${HULY_VERSION:-v0.7.353}
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SERVICE_PASSWORD_SECRET}
      - DB_URL=postgres://huly:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/huly
      - STORAGE_CONFIG=datalake|http://datalake:4031
      - FRONT_URL=https://${HOST_ADDRESS:-huly.example.com}
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
      - MAIL_URL=http://mail:8097
      - AI_BOT_URL=http://aibot:4010
      - WEB_PUSH_URL=http://notification:8091
    restart: unless-stopped

  collaborator:
    image: hardcoreeng/collaborator:${HULY_VERSION:-v0.7.353}
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SERVICE_PASSWORD_SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=datalake|http://datalake:4031
    restart: unless-stopped

  account:
    image: hardcoreeng/account:${HULY_VERSION:-v0.7.353}
    depends_on:
      cockroach:
        condition: service_started
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SERVICE_PASSWORD_SECRET}
      - ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS:-}
      - DB_URL=postgres://huly:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/huly
      - TRANSACTOR_URL=ws://transactor:3333;wss://${HOST_ADDRESS:-huly.example.com}/_transactor
      - STORAGE_CONFIG=datalake|http://datalake:4031
      - FRONT_URL=https://${HOST_ADDRESS:-huly.example.com}
      - STATS_URL=http://stats:4900
      - STATS_API=https://${HOST_ADDRESS:-huly.example.com}/_stats
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=https://${HOST_ADDRESS:-huly.example.com}/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
      - MAIL_URL=http://mail:8097
    restart: unless-stopped

  workspace:
    image: hardcoreeng/workspace:${HULY_VERSION:-v0.7.353}
    environment:
      - SERVER_SECRET=${SERVICE_PASSWORD_SECRET}
      - DB_URL=postgres://huly:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/huly
      - TRANSACTOR_URL=ws://transactor:3333;wss://${HOST_ADDRESS:-huly.example.com}/_transactor
      - STORAGE_CONFIG=datalake|http://datalake:4031
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=postgres://huly:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/huly
    restart: unless-stopped

  front:
    image: hardcoreeng/front:${HULY_VERSION:-v0.7.353}
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SERVICE_PASSWORD_SECRET}
      - LOVE_ENDPOINT=https://${HOST_ADDRESS:-huly.example.com}/_love
      - ACCOUNTS_URL=https://${HOST_ADDRESS:-huly.example.com}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=https://${HOST_ADDRESS:-huly.example.com}/_rekoni
      - CALENDAR_URL=https://${HOST_ADDRESS:-huly.example.com}/_calendar
      - GMAIL_URL=https://${HOST_ADDRESS:-huly.example.com}/_gmail
      - TELEGRAM_URL=https://${HOST_ADDRESS:-huly.example.com}/_telegram
      - STATS_URL=http://stats:4900
      - STATS_API=https://${HOST_ADDRESS:-huly.example.com}/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=wss://${HOST_ADDRESS:-huly.example.com}/_collaborator
      - STORAGE_CONFIG=datalake|http://datalake:4031
      - TITLE=${TITLE:-Huly Self Host}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_CHANNEL=selfhost
      - PULSE_URL=wss://${HOST_ADDRESS:-huly.example.com}/_pulse
      - STREAM_URL=https://${HOST_ADDRESS:-huly.example.com}/_stream/recording
      - PREVIEW_URL=https://${HOST_ADDRESS:-huly.example.com}/_preview
      - DATALAKE_URL=https://${HOST_ADDRESS:-huly.example.com}/_datalake
      - FILES_URL=https://${HOST_ADDRESS:-huly.example.com}/_datalake/blob/:workspace/:blobId/:filename
      - PRINT_URL=https://${HOST_ADDRESS:-huly.example.com}/_print
      - GITHUB_APP=${GITHUB_APPNAME:-}
