name: ${DOCKER_NAME}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: "nginx:1.28-alpine"
    ports:
      - 80
    volumes:
      - ../files/volumes/nginx/.huly.nginx:/etc/nginx/nginx.template:ro
      - ../files/volumes/nginx/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - HOST_ADDRESS=${HOST_ADDRESS}
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:17-alpine
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      - POSTGRES_DB=${PG_DATABASE}
      - POSTGRES_USER=${PG_USERNAME}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huly -d huly"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.11
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --default-log-level=info
    volumes:
      - redpanda:/var/lib/redpanda/data
    environment:
      - REDPANDA_SUPERUSER_USERNAME=${REDPANDA_ADMIN_USER}
      - REDPANDA_SUPERUSER_PASSWORD=${REDPANDA_ADMIN_PWD}
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "user=${REDPANDA_ADMIN_USER}", "-X", "pass=${REDPANDA_ADMIN_PWD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: "minio/minio:RELEASE.2025-09-07T16-13-09Z"
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    volumes:
      - files:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  elastic:
    image: "elasticsearch:7.17.28"
    deploy:
      resources:
        limits:
          memory: 2G
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - elastic:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:8.0.2-alpine3.21
    restart: unless-stopped
    logging: *default-logging

  livekit:
    image: livekit/livekit-server:v1.13.3
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      redis:
        condition: service_started
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - HOST_ADDRESS=${HOST_ADDRESS}
    ports:
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ../files/volumes/livekit/livekit.yaml:/etc/livekit.template:ro
      - ../files/volumes/livekit/entrypoint.sh:/entrypoint.sh
    restart: unless-stopped
    logging: *default-logging

  rekoni:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/rekoni-service:${HULY_VERSION}
    environment:
      - SECRET=${SECRET}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
    logging: *default-logging

  mail:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/mail:${HULY_VERSION}
    environment:
      - PORT=8097
      - SOURCE=${MAIL_FROM:-}
      - QUEUE_CONFIG=redpanda:9092
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SES_ACCESS_KEY=${SES_ACCESS_KEY:-}
      - SES_SECRET_KEY=${SES_SECRET_KEY:-}
      - SES_REGION=${SES_REGION:-}
    restart: unless-stopped
    logging: *default-logging

  print:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/print:${HULY_VERSION}
    environment:
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - STATS_URL=http://stats:4900
    restart: unless-stopped
    logging: *default-logging

  github:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/github:${HULY_VERSION}
    environment:
      - PORT=3500
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - APP_ID=${GITHUB_APPID:-}
      - CLIENT_ID=${GITHUB_CLIENTID:-}
      - CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - COLLABORATOR_URL=wss://${HOST_ADDRESS}/_collaborator
      - WEBHOOK_SECRET=${SECRET}
      - FRONT_URL=https://${HOST_ADDRESS}
      - BOT_NAME=${GITHUB_BOT_NAME:-}
    restart: unless-stopped
    logging: *default-logging

  transactor:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/transactor:${HULY_VERSION}
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SECRET}
      - DB_URL=${PG_DB_URL}
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - FRONT_URL=https://${HOST_ADDRESS}
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
      - MAIL_URL=http://mail:8097
      - AI_BOT_URL=http://aibot:4010
      - WEB_PUSH_URL=http://notification:8091
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3333,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  collaborator:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/collaborator:${HULY_VERSION}
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
    restart: unless-stopped
    logging: *default-logging

  account:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/account:${HULY_VERSION}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SECRET}
      - ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS}
      - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - DB_URL=${PG_DB_URL}
      - PROCEED_V7_MONGO=false
      - TRANSACTOR_URL=ws://transactor:3333;wss://${HOST_ADDRESS}/_transactor
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - FRONT_URL=https://${HOST_ADDRESS}
      - STATS_URL=http://stats:4900
      - STATS_API=https://${HOST_ADDRESS}/_stats
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=https://${HOST_ADDRESS}/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
      - MAIL_URL=http://mail:8097
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  workspace:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/workspace:${HULY_VERSION}
    environment:
      - SERVER_SECRET=${SECRET}
      - DB_URL=${PG_DB_URL}
      - TRANSACTOR_URL=ws://transactor:3333;wss://${HOST_ADDRESS}/_transactor
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=${PG_DB_URL}
      - INIT_REPO_DIR=${INIT_REPO_DIR:-/nonexistent}
    restart: unless-stopped
    logging: *default-logging

  front:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/front:${HULY_VERSION}
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SECRET}
      - LOVE_ENDPOINT=https://${HOST_ADDRESS}/_love
      - ACCOUNTS_URL=https://${HOST_ADDRESS}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=https://${HOST_ADDRESS}/_rekoni
      - CALENDAR_URL=https://${HOST_ADDRESS}/_calendar
      - GMAIL_URL=https://${HOST_ADDRESS}/_gmail
      - TELEGRAM_URL=https://${HOST_ADDRESS}/_telegram
      - TELEGRAM_BOT_URL=https://${HOST_ADDRESS}/_telegram
      - STATS_URL=http://stats:4900
      - STATS_API=https://${HOST_ADDRESS}/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=wss://${HOST_ADDRESS}/_collaborator
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - TITLE=${TITLE:-Huly Self Host}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
      - DESKTOP_UPDATES_CHANNEL=selfhost
      - DISABLED_FEATURES=${DISABLED_FEATURES:-auto-translate,mailboxes}
      - PULSE_URL=wss://${HOST_ADDRESS}/_pulse
      - STREAM_URL=https://${HOST_ADDRESS}/_stream/recording
      - PREVIEW_URL=https://${HOST_ADDRESS}/_preview
      - DATALAKE_URL=https://${HOST_ADDRESS}/_datalake
      - FILES_URL=https://${HOST_ADDRESS}/_datalake/blob/:workspace/:blobId/:filename
      - PRINT_URL=https://${HOST_ADDRESS}/_print
      - GITHUB_APP=${GITHUB_APPNAME:-}
      - GITHUB_CLIENTID=${GITHUB_CLIENTID:-}
      - GITHUB_URL=https://${HOST_ADDRESS}/_github
      - LIVEKIT_WS=wss://${HOST_ADDRESS}/livekit
      - LINK_PREVIEW_URL=http://link-preview:4041
      - AI_URL=https://${HOST_ADDRESS}/_ai
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY:-}
      - BACKUP_URL=https://${HOST_ADDRESS}/_backup/api/backup
      - EXPORT_URL=https://${HOST_ADDRESS}/_export
      - SIGN_URL=https://${HOST_ADDRESS}/_sign
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  datalake:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/datalake:${HULY_VERSION}
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      stats:
        condition: service_started
      account:
        condition: service_healthy
    environment:
      - PORT=4031
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - DB_URL=${PG_DB_URL}
      - BUCKETS=blobs,eu|${S3_ENDPOINT:-http://minio:9000}?accessKey=${S3_ACCESS_KEY:-minioadmin}&secretKey=${S3_SECRET_KEY:-minioadmin}&region=${S3_REGION:-us-east-1}
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped
    logging: *default-logging

  fulltext:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/fulltext:${HULY_VERSION}
    environment:
      - SERVER_SECRET=${SECRET}
      - DB_URL=${PG_DB_URL}
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped
    logging: *default-logging

  stats:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/stats:${HULY_VERSION}
    environment:
      - PORT=4900
      - SERVER_SECRET=${SECRET}
    restart: unless-stopped
    logging: *default-logging

  rating:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/rating:${HULY_VERSION}
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      redpanda:
        condition: service_started
    environment:
      - QUEUE_CONFIG=redpanda:9092
      - SERVER_SECRET=${SECRET}
      - STATS_URL=http://stats:4900
      - DB_URL=${PG_DB_URL}
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - ACCOUNTS_URL=http://account:3000
      - COMMUNICATION_TIME_LOGGING_ENABLED=true
      - COMMUNICATION_API_ENABLED=false
    restart: unless-stopped
    logging: *default-logging

  hulypulse:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/hulypulse:${HULY_VERSION}
    depends_on:
      redis:
        condition: service_started
    environment:
      - HULY_TOKEN_SECRET=${SECRET}
      - HULY_BACKEND=redis
      - HULY_REDIS_URLS=redis://redis:6379
      - HULY_BIND_PORT=8098
      - HULY_REDIS_MODE=direct
    restart: unless-stopped
    logging: *default-logging

  process-service:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/process:${HULY_VERSION}
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      redpanda:
        condition: service_started
      account:
        condition: service_healthy
    environment:
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped
    logging: *default-logging

  stream:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/stream:${HULY_VERSION}
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      - STREAM_ENDPOINT_URL=datalake://datalake:4031
      - STREAM_INSECURE=true
      - STREAM_SERVER_SECRET=${SECRET}
      - STREAM_SERVE_URL=0.0.0.0:1081
      - STREAM_BASE_URL=https://${HOST_ADDRESS}/_stream
      - STREAM_MAX_PARALLEL_SCALING_COUNT=2
      - STREAM_LOG_LEVEL=${STREAM_LOG_LEVEL:-info}
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minioadmin}
      - STREAM_QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped
    logging: *default-logging

  media:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/media:${HULY_VERSION}
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      - ACCOUNTS_URL=http://account:3000
      - SECRET=${SECRET}
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped
    logging: *default-logging

  preview:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/preview:${HULY_VERSION}
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      - SECRET=${SECRET}
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - CACHE_PATH=/data/cache
      - PORT=4043
    restart: unless-stopped
    logging: *default-logging

  love:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/love:${HULY_VERSION}
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      - PORT=8097
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - DB_URL=${PG_DB_URL}
      - STORAGE_CONFIG=datalake|http://datalake:4031
      - S3_STORAGE_CONFIG=s3|${S3_ENDPOINT:-http://minio:9000}?accessKey=${S3_ACCESS_KEY:-minioadmin}&secretKey=${S3_SECRET_KEY:-minioadmin}&region=${S3_REGION:-us-east-1}
      - STORAGE_PROVIDER_NAME=s3
      - LIVEKIT_HOST=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
    restart: unless-stopped
    logging: *default-logging

  link-preview:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/link-preview:${HULY_VERSION}
    environment:
      - SECRET=${SECRET}
      - PORT=4041
    restart: unless-stopped
    logging: *default-logging

  mongo:
    image: mongo:7-jammy
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    logging: *default-logging

  aibot:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/ai-bot:${HULY_VERSION}
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      account:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      - PORT=4010
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - MONGO_URL=mongodb://mongo:27017
      - QUEUE_CONFIG=redpanda:9092
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - FIRST_NAME=${AI_BOT_FIRST_NAME:-Huly}
      - LAST_NAME=${AI_BOT_LAST_NAME:-AI}
      - PASSWORD=${AI_BOT_PASSWORD:-password}
      - AVATAR_PATH=./avatar.png
      - AVATAR_CONTENT_TYPE=image/png
      - STATS_URL=http://stats:4900
      - LOVE_ENDPOINT=http://love:8097
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_SUMMARY_MODEL=${OPENAI_SUMMARY_MODEL:-}
      - OPENAI_TRANSLATE_MODEL=${OPENAI_TRANSLATE_MODEL:-}
    restart: unless-stopped
    logging: *default-logging

  kvs:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/hulykvs:${HULY_VERSION}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - HULY_DB_CONNECTION=${PG_DB_URL}
      - HULY_TOKEN_SECRET=${SECRET}
    restart: unless-stopped
    logging: *default-logging

  calendar:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/calendar:${HULY_VERSION}
    depends_on:
      - kvs
      - mongo
    environment:
      - PORT=8095
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - KVS_URL=http://kvs:8094
      - MONGO_URL=mongodb://mongo:27017
      - QUEUE_CONFIG=redpanda:9092
      - CREDENTIALS=${GOOGLE_CREDENTIALS:-}
      - WATCH_URL=https://${HOST_ADDRESS}/_calendar
    restart: unless-stopped
    logging: *default-logging

  gmail:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/gmail:${HULY_VERSION}
    depends_on:
      - kvs
    environment:
      - PORT=8087
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - KVS_URL=http://kvs:8094
      - QUEUE_CONFIG=redpanda:9092
      - CREDENTIALS=${GOOGLE_CREDENTIALS:-}
    restart: unless-stopped
    logging: *default-logging

  telegram-bot:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/telegram-bot:${HULY_VERSION}
    depends_on:
      postgres:
        condition: service_started
    environment:
      - PORT=4020
      - DB_URL=${PG_DB_URL}
      - BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ACCOUNTS_URL=http://account:3000
      - SECRET=${SECRET}
      - SERVICE_ID=telegram-bot-service
      - STORAGE_CONFIG=s3|${S3_ENDPOINT:-http://minio:9000}?accessKey=${S3_ACCESS_KEY:-minioadmin}&secretKey=${S3_SECRET_KEY:-minioadmin}
      - QUEUE_CONFIG=redpanda:9092
      - QUEUE_REGION=
    restart: unless-stopped
    logging: *default-logging

  pg-jobs:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "/reconcile.sh"]
    depends_on:
      postgres:
        condition: service_started
    environment:
      - PG_DB_URL=${PG_DB_URL}
      - RECONCILE_INTERVAL=${RECONCILE_INTERVAL:-300}
    volumes:
      - ../files/volumes/pg-jobs/reconcile.sh:/reconcile.sh:ro
    restart: unless-stopped
    logging: *default-logging

  love-agent:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/love-agent:${HULY_VERSION}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      - love
      - aibot
      - account
    environment:
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - AI_BOT_PASSWORD=${AI_BOT_PASSWORD:-}
      - PLATFORM_URL=http://aibot:4010
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - STT_PROVIDER=${STT_PROVIDER:-deepgram}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_PROVIDE_LANGUAGE=${OPENAI_PROVIDE_LANGUAGE:-true}
      - DEBUG=${LOVE_AGENT_DEBUG:-false}
    volumes:
      - ../files/volumes/love-agent/entrypoint.sh:/entrypoint.sh
    restart: unless-stopped
    logging: *default-logging

  notification:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/notification:${HULY_VERSION}
    environment:
      - PORT=8091
      - SOURCE=notification
      - PUSH_PUBLIC_KEY=${PUSH_PUBLIC_KEY:-}
      - PUSH_PRIVATE_KEY=${PUSH_PRIVATE_KEY:-}
      - PUSH_SUBJECT=${PUSH_SUBJECT:-mailto:noreply@example.com}
    restart: unless-stopped
    logging: *default-logging

  backup:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/backup:${HULY_VERSION}
    depends_on:
      postgres:
        condition: service_started
      minio:
        condition: service_started
      account:
        condition: service_started
    environment:
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - ACCOUNTS_DB_URL=${PG_DB_URL}
      - DB_URL=${PG_DB_URL}
      - STORAGE=minio|minio?accessKey=${S3_ACCESS_KEY:-minioadmin}&secretKey=${S3_SECRET_KEY:-minioadmin}
      - WORKSPACE_STORAGE=minio|minio?accessKey=${S3_ACCESS_KEY:-minioadmin}&secretKey=${S3_SECRET_KEY:-minioadmin}
      - BUCKET_NAME=backups
      - INTERVAL=3600
      - TIMEOUT=3600
      - COOL_DOWN=300
      - PARALLEL=1
      - KEEP_SNAPSHOTS=84
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped
    logging: *default-logging

  backup-api:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/backup-api:${HULY_VERSION}
    depends_on:
      - minio
      - account
    environment:
      - PORT=4039
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - BUCKET_NAME=backups
      - STORAGE=minio|minio?accessKey=${S3_ACCESS_KEY:-minioadmin}&secretKey=${S3_SECRET_KEY:-minioadmin}
    restart: unless-stopped
    logging: *default-logging

  export:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/export:${HULY_VERSION}
    depends_on:
      postgres:
        condition: service_started
      account:
        condition: service_started
    environment:
      - PORT=4009
      - SECRET=${SECRET}
      - SERVICE_ID=export-service
      - DB_URL=${PG_DB_URL}
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
    restart: unless-stopped
    logging: *default-logging

  sign:
    image: ${HULY_IMAGE_PREFIX:-hardcoreeng}/sign:${HULY_VERSION}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - account
      - minio
    environment:
      - PORT=4006
      - SECRET=${SECRET}
      - SERVICE_ID=sign-service
      - ACCOUNTS_URL=http://account:3000
      - CERTIFICATE_PATH=/var/cfg/certificate.p12
      - CERTIFICATE_PASSWORD=${SIGN_CERTIFICATE_PASSWORD:-password}
      - STORAGE_CONFIG=${STORAGE_CONFIG:-datalake|http://datalake:4031}
      - QUEUE_CONFIG=redpanda:9092
    volumes:
      - sign_cert:/var/cfg
      - ../files/volumes/sign/entrypoint.sh:/entrypoint.sh
    restart: unless-stopped
    logging: *default-logging

volumes:
  pg_data:
  elastic:
  files:
  mongo_data:
  redpanda:
  sign_cert:
