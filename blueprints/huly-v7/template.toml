[variables]
main_domain = "${domain}"
huly_secret = "${base64:64}"
postgres_password = "${password:32}"
redpanda_password = "${password:16}"
livekit_api_key = "${password:16}"
livekit_api_secret = "${base64:32}"

[config]
env = [
  "HULY_VERSION=v0.7.315",
  "TEMPLATE_VERSION=v1.1.4",
  "DOCKER_NAME=huly_v7",
  "HOST_ADDRESS=${main_domain}",
  "SECRET=${huly_secret}",
  "TITLE=Huly",
  "DEFAULT_LANGUAGE=en",
  "LAST_NAME_FIRST=true",
  "POSTGRES_DB=huly",
  "POSTGRES_USER=huly",
  "POSTGRES_PASSWORD=${postgres_password}",
  "CR_DB_URL=postgres://huly:${postgres_password}@postgres:5432/huly",
  "STORAGE_CONFIG=datalake|http://datalake:4031",
  "REDPANDA_ADMIN_USER=admin",
  "REDPANDA_ADMIN_PWD=${redpanda_password}",
  "PLATFORM_ADMIN_EMAILS=",
  "# LiveKit Configuration (built-in - auto-generated keys)",
  "LIVEKIT_API_KEY=${livekit_api_key}",
  "LIVEKIT_API_SECRET=${livekit_api_secret}",
  "# OpenAI Configuration (optional - for AI assistant)",
  "OPENAI_API_KEY=",
  "OPENAI_BASE_URL=",
  "OPENAI_MODEL=",
  "OPENAI_SUMMARY_MODEL=",
  "OPENAI_TRANSLATE_MODEL=",
  "# GitHub Integration (optional - requires GitHub App)",
  "GITHUB_APPID=",
  "GITHUB_APPNAME=",
  "GITHUB_CLIENTID=",
  "GITHUB_CLIENT_SECRET=",
  "GITHUB_PRIVATE_KEY=",
  "GITHUB_BOT_NAME=",
  "# Speech-to-Text Configuration (optional - for AI voice features)",
  "STT_PROVIDER=",
  "STT_URL=",
  "STT_API_KEY=",
  "STT_MODEL=",
  "LOVE_AGENT_STT_PROVIDER=stream",
  "LOVE_AGENT_DEBUG=false",
  "# Email / SMTP Configuration (required for OTP login)",
  "MAIL_FROM=",
  "SMTP_HOST=",
  "SMTP_PORT=587",
  "SMTP_USERNAME=",
  "SMTP_PASSWORD=",
  "# Amazon SES (alternative to SMTP - leave blank if using SMTP)",
  "SES_ACCESS_KEY=",
  "SES_SECRET_KEY=",
  "SES_REGION=",
]

[[config.domains]]
serviceName = "nginx"
port = 80
host = "${main_domain}"

# Entrypoint script that calculates parent domain and patches nginx config
[[config.mounts]]
filePath = "/volumes/nginx/entrypoint.sh"
content = """
#!/bin/sh
set -e

# Calculate parent domain from HOST_ADDRESS
# huly.example.com -> example.com
# app.huly.example.com -> huly.example.com
PARENT_DOMAIN=$(echo "$HOST_ADDRESS" | sed 's/^[^.]*\.//')

echo "=== Huly V7 Nginx Entrypoint ==="
echo "HOST_ADDRESS: $HOST_ADDRESS"
echo "PARENT_DOMAIN: $PARENT_DOMAIN"

# Always regenerate config from template (template is read-only, never modified)
cp /etc/nginx/nginx.template /etc/nginx/conf.d/default.conf
sed -i "s/PARENT_DOMAIN_PLACEHOLDER/.$PARENT_DOMAIN/g" /etc/nginx/conf.d/default.conf
sed -i "s/HOST_ADDRESS_PLACEHOLDER/$HOST_ADDRESS/g" /etc/nginx/conf.d/default.conf

echo "Nginx config generated from template!"
echo "Starting nginx..."

# Start nginx in foreground
exec nginx -g 'daemon off;'
"""

# Nginx config with all V7 routes and cookie fixes
[[config.mounts]]
filePath = "/volumes/nginx/.huly.nginx"
content = """
server {
    listen 80;
    server_name _;
    client_max_body_size 0;

    # Docker embedded DNS - allows nginx to start even if optional services are down
    resolver 127.0.0.11 valid=10s;

    # Frontend
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://front:8080;
    }

    # Accounts - WITH COOKIE FIXES FOR V7 SESSION PERSISTENCE
    location /_accounts {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # IMPORTANT: Hardcode https - $scheme returns "http" inside Docker container
        proxy_set_header X-Forwarded-Proto https;

        rewrite ^/_accounts$ / break;
        rewrite ^/_accounts(/.*)$ $1 break;
        
        # Cookie handling fixes for V7 session persistence
        proxy_cookie_path / /;
        proxy_cookie_flags ~ secure samesite=lax;
        # Dynamic cookie domain - replaced by entrypoint.sh
        proxy_cookie_domain PARENT_DOMAIN_PLACEHOLDER HOST_ADDRESS_PLACEHOLDER;
        
        proxy_pass http://account:3000/;
    }

    # AI Bot (optional - uses variable so nginx starts even if aibot is down)
    location /_ai {
        set $upstream_ai http://aibot:4011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        rewrite ^/_ai(/.*)$ $1 break;
        proxy_pass $upstream_ai;
    }

    # Love (Video calls service)
    location /_love {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        rewrite ^/_love(/.*)$ $1 break;
        proxy_pass http://love:8097/;
    }

    # Collaborator (WebSocket)
    location /_collaborator {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        rewrite ^/_collaborator(/.*)$ $1 break;
        proxy_pass http://collaborator:3078/;
    }

    # Transactor (WebSocket)
    location /_transactor {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        rewrite ^/_transactor(/.*)$ $1 break;
        proxy_pass http://transactor:3333/;
    }

    # Transactor token shortcuts (JWT paths)
    location ~ ^/eyJ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://transactor:3333;
    }

    # Rekoni
    location /_rekoni {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        rewrite ^/_rekoni(/.*)$ $1 break;
        proxy_pass http://rekoni:4004/;
    }

    # Stats
    location /_stats {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        rewrite ^/_stats(/.*)$ $1 break;
        proxy_pass http://stats:4900/;
    }

    # Pulse (WebSocket)
    location /_pulse {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        rewrite ^/_pulse(.*)$ /ws$1 break;
        proxy_pass http://hulypulse:8098;
    }

    # Stream
    location /_stream {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        rewrite ^/_stream(.*)$ $1 break;
        proxy_pass http://stream:1081;
    }

    # Preview
    location /_preview {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        rewrite ^/_preview(.*)$ $1 break;
        proxy_pass http://preview:4043;
    }

    # Datalake
    location /_datalake {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        rewrite ^/_datalake(/.*)$ $1 break;
        proxy_pass http://datalake:4031/;
    }

    # GitHub Integration (optional - uses variable so nginx starts even if github is down)
    location /_github {
        set $upstream_github http://github:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        rewrite ^/_github(/.*)$ $1 break;
        proxy_pass $upstream_github;
    }

    # Print (optional - uses variable so nginx starts even if print is down)
    location /_print {
        set $upstream_print http://print:4005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        rewrite ^/_print(/.*)$ $1 break;
        proxy_pass $upstream_print;
    }

    # Billing
    location /_billing {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        rewrite ^/_billing(/.*)$ $1 break;
        proxy_pass http://billing:4042/;
    }

    # LiveKit signaling (WebSocket)
    location /livekit/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_pass http://livekit:7880/;
    }
}
"""

# LiveKit entrypoint script (replaces placeholders with env vars at runtime)
[[config.mounts]]
filePath = "/volumes/livekit/entrypoint.sh"
content = """
#!/bin/sh
set -e

echo "=== LiveKit Entrypoint ==="
echo "Injecting API keys and domain into config..."

cp /etc/livekit.template /etc/livekit.yaml
sed -i "s|LIVEKIT_KEY_PLACEHOLDER|$LIVEKIT_API_KEY|g" /etc/livekit.yaml
sed -i "s|LIVEKIT_SECRET_PLACEHOLDER|$LIVEKIT_API_SECRET|g" /etc/livekit.yaml
sed -i "s|LIVEKIT_DOMAIN_PLACEHOLDER|$HOST_ADDRESS|g" /etc/livekit.yaml

echo "LiveKit config ready. Starting server..."
exec /livekit-server --config /etc/livekit.yaml
"""

# LiveKit server configuration template (placeholders replaced by entrypoint.sh)
[[config.mounts]]
filePath = "/volumes/livekit/livekit.yaml"
content = """
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
  enable_loopback_candidate: false
redis:
  address: redis:6379
turn:
  enabled: true
  domain: LIVEKIT_DOMAIN_PLACEHOLDER
  udp_port: 3478
  external_tls: true
keys:
  LIVEKIT_KEY_PLACEHOLDER: LIVEKIT_SECRET_PLACEHOLDER
logging:
  json: false
  level: info
"""
